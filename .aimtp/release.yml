{
  "branch": "main",
  "remote": "origin",
  "tagPrefix": "v",
  "checks": [
    "npm test",
    "npm run build"
  ],
  "preflight rules": [
    "noDetachedHead",
    "cleanWorkingTree",
    "fetchTags",
    "onMainOnly",
    "localMainMatchesRemote",
    "prMergeForStable"
  ],
  "requirePrMergeForStable": true,
  "preflight": {
    "allowPrereleaseRelease": false,
    "requirePrMergeForStable": true
  },
  "githubRelease": {
    "enabled": false,
    "generateNotes": true
  }
}
