<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIMTP Web Inbox Demo</title>
    <style>
      :root {
        --bg: #f8f4eb;
        --card: #fffdf8;
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #d7ccbb;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --alert: #b45309;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 0% 0%, #efe2ce 0, transparent 38%),
          radial-gradient(circle at 100% 100%, #d7efe7 0, transparent 42%),
          var(--bg);
      }

      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        letter-spacing: 0.01em;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-top: 20px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 2px 0 rgba(31, 41, 55, 0.04);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-size: 0.9rem;
        color: var(--muted);
      }

      input,
      textarea,
      select,
      button {
        font: inherit;
      }

      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: #fff;
        color: var(--ink);
      }

      textarea {
        min-height: 90px;
        resize: vertical;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        background: var(--accent);
        color: white;
        font-weight: 600;
      }

      button.secondary {
        background: #374151;
      }

      button.warn {
        background: var(--alert);
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .log,
      .inbox {
        max-height: 330px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        padding: 10px;
      }

      .entry {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
        background: #fffcf5;
      }

      .entry h3 {
        margin: 0 0 6px;
        font-size: 0.95rem;
      }

      .entry pre {
        margin: 0;
        font-size: 0.82rem;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .empty {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AIMTP Web Inbox Demo</h1>
      <p>Send envelopes, peek queue depth, and poll recipient mailboxes from the browser.</p>

      <div class="layout">
        <section class="card">
          <div class="grid">
            <div class="field" style="grid-column: 1 / -1">
              <label for="relayBase">Relay Base URL</label>
              <input id="relayBase" type="url" value="https://relay.aimtp.net" />
            </div>
            <div class="field">
              <label for="apiKey">API Key</label>
              <input id="apiKey" type="password" autocomplete="off" />
            </div>
            <div class="field">
              <label for="pollMax">Poll Max</label>
              <select id="pollMax">
                <option value="1">1</option>
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="25">25</option>
                <option value="50">50</option>
              </select>
            </div>
            <div class="field">
              <label for="sender">Sender</label>
              <input id="sender" value="agent-a" />
            </div>
            <div class="field">
              <label for="recipient">Recipient</label>
              <input id="recipient" value="agent-b" />
            </div>
            <div class="field" style="grid-column: 1 / -1">
              <label for="message">Message Content</label>
              <textarea id="message">Hello from AIMTP web demo.</textarea>
            </div>
          </div>

          <div class="actions">
            <button id="sendBtn">Send</button>
            <button id="peekBtn" class="secondary">Peek</button>
            <button id="pollBtn" class="secondary">Poll</button>
            <button id="clearBtn" class="warn">Clear Screen</button>
          </div>
        </section>

        <section class="card stack">
          <div>
            <h2>Inbox</h2>
            <div id="inbox" class="inbox"></div>
          </div>
          <div>
            <h2>Request Log</h2>
            <div id="log" class="log"></div>
          </div>
        </section>
      </div>
    </main>

    <script>
      (function () {
        const relayBaseInput = document.getElementById("relayBase");
        const apiKeyInput = document.getElementById("apiKey");
        const senderInput = document.getElementById("sender");
        const recipientInput = document.getElementById("recipient");
        const messageInput = document.getElementById("message");
        const pollMaxInput = document.getElementById("pollMax");
        const logPanel = document.getElementById("log");
        const inboxPanel = document.getElementById("inbox");

        const sendBtn = document.getElementById("sendBtn");
        const peekBtn = document.getElementById("peekBtn");
        const pollBtn = document.getElementById("pollBtn");
        const clearBtn = document.getElementById("clearBtn");

        function uid() {
          if (window.crypto && typeof window.crypto.randomUUID === "function") {
            return window.crypto.randomUUID();
          }
          return `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        function parseBaseUrl() {
          const raw = relayBaseInput.value.trim();
          if (!raw) {
            throw new Error("Relay base URL is required.");
          }
          return new URL(raw);
        }

        function makeEndpoint(path, params) {
          const base = parseBaseUrl();
          const url = new URL(path, base);
          if (params) {
            url.search = new URLSearchParams(params).toString();
          }
          return url;
        }

        function clearPanel(panel, placeholder) {
          panel.innerHTML = "";
          const p = document.createElement("p");
          p.className = "empty";
          p.textContent = placeholder;
          panel.appendChild(p);
        }

        function appendLog(label, status, payload) {
          if (logPanel.firstElementChild && logPanel.firstElementChild.classList.contains("empty")) {
            logPanel.innerHTML = "";
          }

          const entry = document.createElement("div");
          entry.className = "entry";

          const title = document.createElement("h3");
          title.textContent = `[${new Date().toLocaleTimeString()}] ${label} → HTTP ${status}`;

          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(payload, null, 2);

          entry.appendChild(title);
          entry.appendChild(pre);
          logPanel.prepend(entry);
        }

        function appendInbox(item) {
          if (inboxPanel.firstElementChild && inboxPanel.firstElementChild.classList.contains("empty")) {
            inboxPanel.innerHTML = "";
          }

          const entry = document.createElement("div");
          entry.className = "entry";

          const payload =
            item && typeof item === "object" && "message" in item ? item.message : item;
          const heading = document.createElement("h3");
          heading.textContent = `${payload && payload.id ? payload.id : "-"} • ${
            payload && payload.timestamp ? payload.timestamp : "-"
          }`;

          const detail = {
            sender: payload && payload.sender ? payload.sender : "-",
            recipient: payload && payload.recipient ? payload.recipient : "-",
            role:
              payload && typeof payload === "object" && "role" in payload ? payload.role || "-" : "-",
            content:
              payload && typeof payload === "object" && "content" in payload ? payload.content || "" : ""
          };

          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(detail, null, 2);

          entry.appendChild(heading);
          entry.appendChild(pre);
          inboxPanel.prepend(entry);
        }

        async function requestJson(label, url, options) {
          const response = await fetch(url, options);
          const text = await response.text();
          let body;
          try {
            body = text ? JSON.parse(text) : null;
          } catch (_err) {
            body = { raw: text };
          }
          appendLog(label, response.status, body);
          return { response, body };
        }

        function getKeyOrThrow() {
          const key = apiKeyInput.value;
          if (!key) {
            throw new Error("API key is required.");
          }
          return key;
        }

        async function onSend() {
          const sender = senderInput.value.trim();
          const recipient = recipientInput.value.trim();
          const content = messageInput.value.trim();
          if (!sender || !recipient || !content) {
            throw new Error("Sender, recipient, and message content are required.");
          }

          const mailboxMessage = {
            id: uid(),
            timestamp: new Date().toISOString(),
            sender,
            recipient,
            role: "user",
            content
          };

          const key = getKeyOrThrow();
          const url = makeEndpoint("/aimtp/mailbox");
          await requestJson("SEND", url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-AIMTP-KEY": key
            },
            body: JSON.stringify({ recipient, message: mailboxMessage })
          });
        }

        async function onPeek() {
          const recipient = recipientInput.value.trim();
          if (!recipient) {
            throw new Error("Recipient is required.");
          }
          const key = getKeyOrThrow();
          const url = makeEndpoint("/aimtp/peek", { recipient });
          await requestJson("PEEK", url, {
            method: "GET",
            headers: { "X-AIMTP-KEY": key }
          });
        }

        async function onPoll() {
          const recipient = recipientInput.value.trim();
          if (!recipient) {
            throw new Error("Recipient is required.");
          }
          const key = getKeyOrThrow();
          const max = pollMaxInput.value || "10";
          const url = makeEndpoint("/aimtp/poll", { recipient, max });
          const ackUrl = makeEndpoint("/aimtp/ack");
          const { response, body } = await requestJson("POLL", url, {
            method: "GET",
            headers: { "X-AIMTP-KEY": key }
          });

          if (response.ok && Array.isArray(body)) {
            for (const item of body) {
              if (item && item.envelope) {
                appendInbox(item.envelope);
              }
              if (item && item.lease_id) {
                await requestJson("ACK", ackUrl, {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "X-AIMTP-KEY": key
                  },
                  body: JSON.stringify({ recipient, lease_id: item.lease_id })
                });
              }
            }
          }
        }

        function onClear() {
          clearPanel(inboxPanel, "Inbox is empty.");
          clearPanel(logPanel, "No requests yet.");
        }

        async function safeRun(action) {
          try {
            await action();
          } catch (err) {
            appendLog("ERROR", 0, { message: err && err.message ? err.message : String(err) });
          }
        }

        sendBtn.addEventListener("click", () => safeRun(onSend));
        peekBtn.addEventListener("click", () => safeRun(onPeek));
        pollBtn.addEventListener("click", () => safeRun(onPoll));
        clearBtn.addEventListener("click", onClear);

        onClear();
      })();
    </script>
  </body>
</html>
