services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      INTENTOS: "on"
      INTENTOS_MODE: "enforce"
      AIMTP_CAPABILITIES: "on"
      AIMTP_CAP_MODE: "enforce"
      AIMTP_CAP_PUBLIC_KEY: "${AIMTP_CAP_PUBLIC_KEY:-}"
      AIMTP_CAP_PRIVATE_KEY: "${AIMTP_CAP_PRIVATE_KEY:-}"
      AIMTP_STORE: "redis"
      AIMTP_REDIS_URL: "redis://redis:6379"
      AIMTP_ALLOWED_RECIPIENTS: "demo-agent"
      AIMTP_RELAY_INSTANCE_ID: "relay-1"

volumes:
  redis-data:
