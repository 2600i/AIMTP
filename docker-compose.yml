services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    # Published on loopback only, like the gateway below. This compose file is a
    # local development topology: no API key is set, so the relay is fail-closed
    # and denies every request — but supplying AIMTP_API_KEY through a .env file
    # would otherwise turn this into an authenticated relay reachable from the
    # network. Put a reverse proxy in front of it before publishing it wider.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      # Bind all interfaces *inside* the container so Docker can forward the
      # loopback-published port to it. The host mapping above is the boundary.
      AIMTP_BIND_HOST: "0.0.0.0"
      INTENTOS: "on"
      INTENTOS_MODE: "enforce"
      AIMTP_CAPABILITIES: "on"
      AIMTP_CAP_MODE: "enforce"
      AIMTP_CAP_PUBLIC_KEY: "${AIMTP_CAP_PUBLIC_KEY:-}"
      AIMTP_CAP_PRIVATE_KEY: "${AIMTP_CAP_PRIVATE_KEY:-}"
      AIMTP_STORE: "redis"
      AIMTP_REDIS_URL: "redis://redis:6379"
      AIMTP_ALLOWED_RECIPIENTS: "demo-agent"
      AIMTP_RELAY_INSTANCE_ID: "relay-1"

  trust-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    # Published on loopback only: the operator routes control real approvals.
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      PORT: "8788"
      AIMTP_BIND_HOST: "0.0.0.0"
      AIMTP_TRUST_GATEWAY_CONFIG: "/app/config/trust-gateway.demo.json"
      AIMTP_TRUST_GATEWAY_STORE: "sqlite"
      AIMTP_TRUST_GATEWAY_SQLITE_PATH: "/app/gateway-data/aimtp-trust-gateway.sqlite"
      # Required. Public keys only; never put private keys here.
      # Without it every request is denied.
      AIMTP_TRUSTED_KEYS: "${AIMTP_TRUSTED_KEYS:-}"
      # Required for /gateway/approvals and /gateway/audit. Format:
      # operator-id=token,operator-id=token. Without it those routes return 503.
      AIMTP_GATEWAY_OPERATOR_TOKENS: "${AIMTP_GATEWAY_OPERATOR_TOKENS:-}"
    volumes:
      - trust-gateway-data:/app/gateway-data
    command: ["node", "dist/runtime/trust-gateway.js"]
    # The image's own HEALTHCHECK probes the relay's port, not this one, so it
    # is replaced here rather than inherited. /healthz is unauthenticated by
    # design — it reports that the process is serving, nothing about approvals.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8788/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  redis-data:
  trust-gateway-data:
