services:
  redis-a:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]

  relay-a:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis-a
    ports:
      - "18787:8787"
    environment:
      PORT: "8787"
      AIMTP_STORE: "redis"
      AIMTP_REDIS_URL: "redis://redis-a:6379"
      AIMTP_RELAY_INSTANCE_ID: "relay-a"
      INTENTOS_RECEIPTS_PATH: "/app/runtime/relay-a-receipts.jsonl"
      INTENTOS_RECEIPTS_DELIVER: "on"
      INTENTOS_RECEIPTS_SIGN: "on"
      INTENTOS_RECEIPTS_ISSUER: "relay://a"
      INTENTOS_TRUST_VERSION: "${INTENTOS_TRUST_VERSION:-v1}"
      # Rendered by scripts/generate-federation-keys.mjs into the .local.yml
      # that the demo actually runs. No key material is committed.
      INTENTOS_RECEIPTS_PRIVATE_KEY: __RELAY_A_PRIVATE_KEY__
      INTENTOS_TRUSTED_RECEIPT_KEYS_JSON: __TRUSTED_KEYS_A__

  redis-b:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]

  relay-b:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis-b
    ports:
      - "28787:8787"
    environment:
      PORT: "8787"
      AIMTP_STORE: "redis"
      AIMTP_REDIS_URL: "redis://redis-b:6379"
      AIMTP_RELAY_INSTANCE_ID: "relay-b"
      INTENTOS_RECEIPTS_PATH: "/app/runtime/relay-b-receipts.jsonl"
      INTENTOS_RECEIPTS_DELIVER: "on"
      INTENTOS_RECEIPTS_SIGN: "on"
      INTENTOS_RECEIPTS_ISSUER: "relay://b"
      INTENTOS_TRUST_VERSION: "${INTENTOS_TRUST_VERSION:-v1}"
      # Rendered by scripts/generate-federation-keys.mjs into the .local.yml
      # that the demo actually runs. No key material is committed.
      INTENTOS_RECEIPTS_PRIVATE_KEY: __RELAY_B_PRIVATE_KEY__
      INTENTOS_TRUSTED_RECEIPT_KEYS_JSON: __TRUSTED_KEYS_B__
