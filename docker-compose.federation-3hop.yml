services:
  redis-a:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]

  relay-a:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis-a
    ports:
      - "18787:8787"
    environment:
      PORT: "8787"
      AIMTP_STORE: "redis"
      AIMTP_REDIS_URL: "redis://redis-a:6379"
      AIMTP_RELAY_INSTANCE_ID: "relay-a"
      INTENTOS_RECEIPTS_PATH: "/app/runtime/relay-a-receipts.jsonl"
      INTENTOS_RECEIPTS_DELIVER: "on"
      INTENTOS_RECEIPTS_SIGN: "on"
      INTENTOS_RECEIPTS_ISSUER: "relay://a"
      INTENTOS_TRUST_VERSION: "${INTENTOS_TRUST_VERSION:-v1}"
      # Demo-only key material for local federation interop testing.
      INTENTOS_RECEIPTS_PRIVATE_KEY: |-
        -----BEGIN PRIVATE KEY-----
        MC4CAQAwBQYDK2VwBCIEID1Ojr6UbUbvQaY1SFTC6sQpaF8dyhVFsYgQ1RrI8Lcz
        -----END PRIVATE KEY-----
      INTENTOS_TRUSTED_RECEIPT_KEYS_JSON: >-
        {"relay://a":"-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAQfzjXFsveEOYsv55DKXnd7VcM66OXZbDq3ACaKMwdoo=\n-----END PUBLIC KEY-----\n","relay://b":"-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEApGNKaYbjOmsXFIzMGv5S27A3s/ORB2vcILeZCkxRjNc=\n-----END PUBLIC KEY-----\n"}

