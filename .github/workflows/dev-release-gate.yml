name: Dev Release Gate

on:
  push:
    branches:
      - v0.4.1-dev
  pull_request:
    branches:
      - v0.4.1-dev

jobs:
  dev-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Receipt and trust tests
        run: npm run test:receipts
      - name: Verify release state
        run: npm run release:verify
