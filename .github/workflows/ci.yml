name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Start docker compose
        run: docker compose up -d
      - name: Wait for relay container
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in {1..20}; do
            if docker compose exec -T relay sh -lc "true" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps
            docker compose logs relay
            exit 1
          fi
      - name: Relay tests in docker compose
        run: docker compose exec -T relay npm test
      - name: Revocation smoke in docker compose
        run: docker compose exec -T relay npm run smoke:revocations
      - name: Dump docker compose logs on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          docker compose ps || true
          docker compose logs relay || true
          docker compose logs redis || true

  tag-guardrails:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify release tag guardrails
        run: node scripts/release-tag-guardrails.mjs --tag "${GITHUB_REF_NAME}"
